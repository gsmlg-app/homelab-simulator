name: app_database
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  logging: ^1.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  app_lib_engine:
    path: ../engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  # Newer releases require analyzer >=14, incompatible with Flutter-pinned tests.
  build_runner: ^2.16.1
  app_lib_core: any
